name: BotwCraft Minecraft triangle wireframe
on:
  push:
    branches: [botw-rust-native-collisions]
    paths:
      - 'fabric/**'
      - '.github/workflows/botw-triangle-wireframe.yml'
  workflow_dispatch:
jobs:
  fabric-jar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Minecraft 26.3 mod
        working-directory: fabric
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace build
      - uses: actions/upload-artifact@v4
        with:
          name: botwcraft-triangle-wireframe-compiled
          path: fabric/build/libs/skycraft-0.1.2.jar
          if-no-files-found: error
