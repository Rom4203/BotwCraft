name: BOTW bridge Python tests
on:
  push:
    branches: [botw-ryujinx-development, main]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s botw -p 'test_*.py' -v
