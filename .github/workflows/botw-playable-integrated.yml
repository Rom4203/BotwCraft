name: BotwCraft one source branch complete playable build
on:
  push:
    branches: [botwcraft/real-anchor-runtime-20261014]
    paths:
      - "fabric/**"
      - "botw/integrated-compositor/**"
      - "botw/rust-scene-relay/**"
      - "botw/rust-terrain-bdp3/sources/botw/rust_bridge/**"
      - "botw/rust-terrain-bdp3/sources/botw/wxlm/**"
      - "botw/scripts/**"
      - ".github/workflows/botw-playable-integrated.yml"
  workflow_dispatch:
jobs:
  minecraft:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Minecraft 26.3 real BotwCraft, hand+GUI, no Skyrim takeover
        working-directory: fabric
        shell: pwsh
        run: .\gradlew.bat build --no-daemon --stacktrace
      - name: Refuse missing classes or hand removal mixins in released JAR
        shell: pwsh
        working-directory: fabric
        run: python ..\botw\scripts\validate_botwcraft_mod.py build/libs/skycraft-0.1.2.jar
      - uses: actions/upload-artifact@v4
        with:
          name: BotwCraft-Playable-Fabric
          path: fabric/build/libs/skycraft-0.1.2.jar
          if-no-files-found: error
  native-bridge:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Native link and Havok collision regression tests
        working-directory: botw/rust-terrain-bdp3/sources/botw/rust_bridge
        run: cargo test --verbose
      - name: Build Rust game transport EXE
        working-directory: botw/rust-terrain-bdp3/sources/botw/rust_bridge
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: BotwCraft-Playable-RustBridge
          path: botw/rust-terrain-bdp3/sources/botw/rust_bridge/target/release/botwcraft-rust-bridge.exe
          if-no-files-found: error
  gpu-world:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: botw/integrated-compositor
      - name: Test stationary Hyrule world coordinates and Zelda matrix eye
        working-directory: botw/integrated-compositor
        run: cargo test --verbose
      - name: Compile Minecraft textured 3D + Zelda world-depth GPU EXE
        working-directory: botw/integrated-compositor
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: BotwCraft-Playable-Compositor
          path: botw/integrated-compositor/target/release/botwcraft-compositor.exe
          if-no-files-found: error
  zelda-native:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Native WiiXLaunch SDK
        run: git clone --depth=1 https://github.com/BladesawStudios/WiiXLaunch.git vendor/WiiXLaunch
      - name: Compile Zelda 1.5.0 camera module (same branch)
        run: |
          python3 vendor/WiiXLaunch/sdk/scripts/build_mod.py --source botw/rust-terrain-bdp3/sources/botw/wxlm --target switch --wiixlaunch vendor/WiiXLaunch/sdk --out build-playable
          test -s build-playable/switch-mods/bwc_pose.wxlm
      - uses: actions/upload-artifact@v4
        with:
          name: BotwCraft-Playable-ZeldaNative
          path: build-playable/switch-mods/bwc_pose.wxlm
          if-no-files-found: error
