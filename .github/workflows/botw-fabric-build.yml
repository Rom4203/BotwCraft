name: BotwCraft Minecraft Fabric 26.3
on:
  push:
    branches: [botw-native-creative-flight]
    paths:
      - 'fabric/**'
      - '.github/workflows/botw-fabric-build.yml'
  workflow_dispatch:
jobs:
  fabric:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build updated Minecraft BotwCraft mod
        working-directory: fabric
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace build
      - name: Upload Minecraft mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: botwcraft-minecraft-fabric-fixedfps
          path: |
            fabric/build/libs/*-0.1.2.jar
          if-no-files-found: error
