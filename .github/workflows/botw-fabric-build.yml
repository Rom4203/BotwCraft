name: Minecraft Fabric build
on:
  push:
    branches: [botw-ryujinx-development]
    paths:
      - 'fabric/**'
      - '.github/workflows/botw-fabric-build.yml'
  pull_request:
    paths:
      - 'fabric/**'
      - '.github/workflows/botw-fabric-build.yml'
jobs:
  fabric:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Minecraft 26.3 Fabric mod
        working-directory: fabric
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace build
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: botwcraft-fabric-preview
          path: fabric/build/libs/*jar
          if-no-files-found: error
