name: BotwCraft genuine native Zelda scene depth investigation
on:
  push:
    branches: [botwcraft/native-depth-investigation-20261013]
    paths:
      - 'botw/native-depth-probe/**'
      - '.github/workflows/botw-native-depth-probe.yml'
  workflow_dispatch:
jobs:
  genuine-nvn-depth:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated Windows installer and log monitor syntax
        run: python3 -m py_compile botw/native-depth-probe/installer.py botw/native-depth-probe/monitor.py
      - name: Build isolated Switch native depth observation module
        run: |
          git clone --depth=1 https://github.com/BladesawStudios/WiiXLaunch.git vendor/WiiXLaunch
          python3 vendor/WiiXLaunch/sdk/scripts/build_mod.py --source botw/native-depth-probe --target switch --wiixlaunch vendor/WiiXLaunch/sdk --out build-native-depth
          test -s build-native-depth/switch-mods/bwc_depth_probe.wxlm
      - uses: actions/upload-artifact@v4
        with:
          name: BotwCraft-EXPERIMENTAL-native-depth-only
          path: build-native-depth/switch-mods/bwc_depth_probe.wxlm
          if-no-files-found: error
