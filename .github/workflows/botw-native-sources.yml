name: BOTW native WiiXLaunch integration
on:
  push:
    branches: [botw-ryujinx-development]
    paths:
      - '.gitmodules'
      - 'WiiXLaunch'
      - 'botw/guest_mod/**'
      - 'botw/native_direct_executor.hpp'
      - 'botw/test_native_direct_executor.cpp'
      - 'botw/native_direct_pose.hpp'
      - 'botw/test_native_direct_pose.cpp'
      - 'botw/native_world_scene.hpp'
      - 'botw/test_native_world_scene.cpp'
      - 'botw/setup_wiixlaunch.py'
      - 'botw/guard_switch_player_hook.py'
      - 'botw/guard_switch_fs.py'
      - 'botw/guard_unknown_switch_build.py'
      - 'botw/patch_botw15_player_pose.py'
      - 'BUILD_AND_PACKAGE.bat'
      - 'build_botw_windows.bat'
      - '.github/workflows/botw-native-sources.yml'
  pull_request:
    paths:
      - '.gitmodules'
      - 'WiiXLaunch'
      - 'botw/guest_mod/**'
      - 'botw/setup_wiixlaunch.py'
      - 'botw/guard_switch_player_hook.py'
      - 'botw/guard_switch_fs.py'
      - 'botw/guard_unknown_switch_build.py'
      - 'botw/patch_botw15_player_pose.py'
      - '.github/workflows/botw-native-sources.yml'
jobs:
  validate-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch pinned WiiXLaunch and wiixlaunch-botw
        run: python botw/setup_wiixlaunch.py
      - name: Guard unverified Switch hooks
        run: python botw/guard_switch_player_hook.py
      - name: Guard unmounted Switch SD filesystem access
        run: python botw/guard_switch_fs.py
      - name: Refuse every native hook on an unrecognised BOTW build
        run: python botw/guard_unknown_switch_build.py
      - name: Assert bad SD path is refused before filesystem calls
        run: grep -q "IsSdPath(path) \&\& !g_FSClientReady" WiiXLaunch/include/wiixlaunch/fs.hpp
      - name: Install BOTW 1.5.0 fingerprint-locked PlayerInfo pose callback
        run: python botw/patch_botw15_player_pose.py
      - name: Verify native pose callback is installed and guarded
        run: |
          grep -q "BotwCraft15::Register();" WiiXLaunch/src/main.cpp
          grep -q "0xA982D2BC" WiiXLaunch/include/wiixlaunch/botwcraft_switch15_pose.hpp
          grep -q "0x854BA8" WiiXLaunch/include/wiixlaunch/botwcraft_switch15_pose.hpp
      - name: Compile native guest against actual WiiXLaunch SDK
        run: |
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Wall -Wextra \
            -I WiiXLaunch/include \
            -I WiiXLaunch/sdk/include \
            botw/guest_mod/mod.cpp botw/guest_mod/test_native.cpp \
            -o /tmp/botw-native-api-test
          /tmp/botw-native-api-test
      - name: Validate real 3D Hyrule scene packet decoder
        run: |
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Wall -Wextra \
            -I botw botw/test_native_world_scene.cpp -o /tmp/botw-world-scene-test
          /tmp/botw-world-scene-test
      - name: Verify native first-person direct transform ABI
        run: |
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Wall -Wextra \
            -I botw botw/test_native_direct_pose.cpp -o /tmp/botw-direct-pose-test
          /tmp/botw-direct-pose-test
      - name: Verify atomic Link and camera backend lifecycle
        run: |
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Wall -Wextra \
            -I botw botw/test_native_direct_executor.cpp -o /tmp/botw-direct-executor-test
          /tmp/botw-direct-executor-test
      - name: Verify game-module source pin
        run: |
          test "$(git -C WiiXLaunch rev-parse HEAD)" = "30e0502ff2abb76b1816e8271d4126e0a95ac9fc"
          test "$(git -C WiiXLaunch/vendor/wiixlaunch-botw rev-parse HEAD)" = "49e07a6acd6d675a98cba3bb8fc244c39bce8790"
