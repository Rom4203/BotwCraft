name: BotwCraft SkyCraft camera parity
on:
  push:
    branches: [botwcraft/skycraft-camera-match-20261013, botwcraft/worldlocked-view-20261014]
    paths:
      - 'fabric/**'
      - 'botw/rust-terrain-bdp3/sources/botw/rust_bridge/**'
      - '.github/workflows/botw-skycraft-camera.yml'
  workflow_dispatch:
jobs:
  camera-rust:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test F5 camera transforms and transport
        working-directory: botw/rust-terrain-bdp3/sources/botw/rust_bridge
        run: cargo test --verbose
      - name: Build actual Windows native bridge
        working-directory: botw/rust-terrain-bdp3/sources/botw/rust_bridge
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: BotwCraft-WorldLocked-Camera-Rust
          path: botw/rust-terrain-bdp3/sources/botw/rust_bridge/target/release/botwcraft-rust-bridge.exe
          if-no-files-found: error
  zelda-native-camera:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Fetch WiiXLaunch native mod SDK
        run: git clone --depth=1 https://github.com/BladesawStudios/WiiXLaunch.git vendor/WiiXLaunch
      - name: Build modified BOTW 1.5.0 guest with real optical-camera capture
        run: |
          python3 vendor/WiiXLaunch/sdk/scripts/build_mod.py --source botw/rust-terrain-bdp3/sources/botw/wxlm --target switch --wiixlaunch vendor/WiiXLaunch/sdk --out build-optical
          test -s build-optical/switch-mods/bwc_pose.wxlm
      - uses: actions/upload-artifact@v4
        with:
          name: BotwCraft-Zelda-Native-Optical-View
          path: build-optical/switch-mods/bwc_pose.wxlm
          if-no-files-found: error
  minecraft-java:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Minecraft client with F5 optical camera export
        working-directory: fabric
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace build
      - uses: actions/upload-artifact@v4
        with:
          name: BotwCraft-SkyCraft-Camera-Fabric
          path: fabric/build/libs/*jar
          if-no-files-found: error
