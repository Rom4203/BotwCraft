name: BOTW Switch ARM64 real build
on:
  workflow_dispatch:
  push:
    branches: [botw-ryujinx-development]
    paths:
      - '.github/workflows/botw-switch-build.yml'
      - 'botw/guest_mod/**'
      - 'botw/patch_botw15_player_pose.py'
      - 'botw/guard_switch_player_hook.py'
      - 'botw/guard_switch_fs.py'
      - 'botw/guard_unknown_switch_build.py'
      - 'botw/verify_native_heap.py'
      - 'botw/native_hud_packet.hpp'
      - 'botw/native_hud_bridge.py'
      - 'botw/native_guest_mesh.hpp'
      - 'botw/native_world_scene.hpp'
      - 'botw/world_space.py'
      - 'botw/world_gdb_bridge.py'
      - 'botw/setup_wiixlaunch.py'
      - 'WiiXLaunch'
      - 'build_botw_windows.bat'
      - 'package_botw_windows.py'
      - 'packaging/INSTALL_NATIVE_TEST.bat'
      - 'packaging/START_BRIDGE.bat'
      - 'packaging/README_INSTALL.txt'
      - 'botw/install_native.py'
  pull_request:
    paths:
      - '.github/workflows/botw-switch-build.yml'
      - 'botw/guest_mod/**'
      - 'botw/patch_botw15_player_pose.py'
      - 'botw/guard_switch_player_hook.py'
      - 'botw/guard_switch_fs.py'
      - 'botw/guard_unknown_switch_build.py'
      - 'botw/native_guest_mesh.hpp'
      - 'botw/setup_wiixlaunch.py'
jobs:
  switch-aarch64:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check out exact WiiXLaunch and BOTW module
        run: python botw/setup_wiixlaunch.py
      - name: Guard invalid game hooks
        run: python botw/guard_switch_player_hook.py
      - name: Guard unmounted Switch SD filesystem access
        run: python botw/guard_switch_fs.py
      - name: Refuse every native hook on an unrecognised BOTW build
        run: python botw/guard_unknown_switch_build.py
      - name: Apply Switch 1.5.0 Link pose reader
        run: python botw/patch_botw15_player_pose.py
      - name: Cross-compile the REAL Switch subsdk9 and guest wxlm
        run: |
          # Try Google's verified Docker Hub pull-through cache first.
          # GitHub's shared runner IPs sometimes hit Docker Hub anonymous limits.
          image="mirror.gcr.io/devkitpro/devkita64:20260219"
          if ! docker pull "$image"; then
            echo "::warning::Public registry mirror cache unavailable; trying upstream Docker Hub"
            image="devkitpro/devkita64:20260219"
            docker pull "$image"
          fi
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -e WIIXL_TARGET=botw \
            "$image" \
            bash -euc '
              export DEVKITPRO=/opt/devkitpro
              export DEVKITA64=/opt/devkitpro/devkitA64
              export PATH="$DEVKITPRO/tools/bin:$PATH"
              echo "=== devkitA64 Switch host ==="
              cd WiiXLaunch
              bash build_switch.sh
              echo "=== devkitA64 Switch guest ==="
              python3 sdk/scripts/build_mod.py \
                --source ../botw/guest_mod \
                --target switch \
                --out ../botw/guest_mod/build
            '
      - name: Verify compiled WiiXLaunch HUD heap request in real wxlm
        run: python botw/verify_native_heap.py botw/guest_mod/build/switch-mods/botwcraft.wxlm botw/guest_mod/mod.json
      - name: Verify nonempty Nintendo-free mod artifacts
        run: |
          test -s WiiXLaunch/build/switch/subsdk9
          test -s botw/guest_mod/build/switch-mods/botwcraft.wxlm
          file WiiXLaunch/build/switch/subsdk9 botw/guest_mod/build/switch-mods/botwcraft.wxlm
          sha256sum WiiXLaunch/build/switch/subsdk9 botw/guest_mod/build/switch-mods/botwcraft.wxlm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the original SkyCraft-derived Fabric Minecraft module
        working-directory: fabric
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build
      - name: Assemble the single Windows native test ZIP
        run: python package_botw_windows.py --output dist/BotwCraft-Switch-15-test.zip
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: BotwCraft-Switch-15-Native-Test-Complete
          path: dist/BotwCraft-Switch-15-test.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: BotwCraft-Native-Switch-15-unverified-runtime
          path: |
            WiiXLaunch/build/switch/subsdk9
            botw/guest_mod/build/switch-mods/botwcraft.wxlm
          if-no-files-found: error
