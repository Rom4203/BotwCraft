name: Minecraft 26.3 isolated GUI layer
on:
  push:
    paths:
      - "fabric/**"
      - ".github/workflows/botw-java-gui-layer.yml"
  pull_request:
    paths:
      - "fabric/**"
      - ".github/workflows/botw-java-gui-layer.yml"
jobs:
  fabric:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: fabric
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and package mod
        shell: pwsh
        run: .\gradlew.bat build --no-daemon --stacktrace
      - name: Refuse missing Fabric mixins or Skyrim-only binary
        shell: pwsh
        run: python ..\\botw\\scripts\\validate_botwcraft_mod.py build/libs/skycraft-0.1.2.jar
      - name: Publish experimental Fabric JAR
        uses: actions/upload-artifact@v4
        with:
          name: botwcraft-fabric-gui-layer-experimental
          path: fabric/build/libs/*.jar
          if-no-files-found: error
