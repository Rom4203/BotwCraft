name: Resolve BOTW SoundLink player name symbols
on:
  push:
    branches: [botw-native-creative-flight]
    paths:
      - '.github/workflows/botw-symbols.yml'
  workflow_dispatch:
jobs:
  symbols:
    runs-on: ubuntu-latest
    steps:
      - name: Find safe actor-local sound SLink controls on BOTW Switch 1.5.0
        shell: python
        run: |
          import urllib.request, re
          url="https://raw.githubusercontent.com/zeldaret/botw/master/data/uking_functions.csv"
          s=urllib.request.urlopen(url,timeout=30).read().decode('utf-8')
          lines=[line for line in s.splitlines() if
                 re.search(r'xlink2::UserInstance::getUserName|xlink2::User::getUserName|xlink2::UserInstance::setIsActive|xlink2::UserInstance::killAll|ResourceAccessorSLink::getVolume|SLink::stopAllEvent|xlink::XLink::',line,re.I)]
          print("BOTW_AUDIO_SYMBOL_MATCHES",len(lines))
          for line in lines[:110]: print(line[:450])
