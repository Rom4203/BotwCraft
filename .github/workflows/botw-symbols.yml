name: Investigate BOTW Havok raycast NX150 symbols
on:
  push:
    branches: [botw-test20-responsive60-20261010]
    paths:
      - '.github/workflows/botw-symbols.yml'
  workflow_dispatch:
jobs:
  symbols:
    runs-on: ubuntu-latest
    steps:
      - name: Find native raycast ctor and synchronous query, resource-ground collision for Steve
        shell: python
        run: |
          import urllib.request, re
          url="https://raw.githubusercontent.com/zeldaret/botw/master/data/uking_functions.csv"
          s=urllib.request.urlopen(url,timeout=30).read().decode('utf-8')
          lines=[line for line in s.splitlines() if
                 re.search(r'ksys::phys::RayCast::(RayCast|worldRayCast|setStartAndEnd|setStart|setEnd|enableLayer|getHitPosition|getHitNormal|reset)|_ZN4ksys4phys7RayCast|RayCastForRequest|GroundHit',line,re.I)]
          print("BOTW_RENDER_PHYSICS_SYMBOL_MATCHES",len(lines))
          for line in lines[:170]: print(line[:450])
